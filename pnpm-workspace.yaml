autoInstallPeers: true
configDependencies:
  "@effected/pnpm-plugin-effected": 0.26.0
  "@savvy-web/pnpm-plugin-silk": 0.53.0
linkWorkspacePackages: deep
minimumReleaseAgeExclude:
  - "@effected/pnpm-plugin-effected"
  - "@savvy-web/pnpm-plugin-silk"
  - "@rspack/*"
nodeOptions: --import=tsx
packages:
  - packages/*
  - playground
  - plugin
  - website
peerDependencyRules:
  ignoreMissing:
    - "@vitest/coverage-istanbul"
    - "@vitest/coverage-v8"
    - vitest

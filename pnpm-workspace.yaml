autoInstallPeers: true
configDependencies:
  "@effected/pnpm-plugin-effect": 0.18.6
  "@savvy-web/pnpm-plugin-silk": 0.51.0
linkWorkspacePackages: deep
minimumReleaseAgeExclude:
  - "@effected/pnpm-plugin-effect"
  - "@savvy-web/pnpm-plugin-silk"
packages:
  - packages/*
  - playground
  - plugin
  - website
peerDependencyRules:
  ignoreMissing:
    - "@vitest/coverage-istanbul"
    - "@vitest/coverage-v8"
    - vitest

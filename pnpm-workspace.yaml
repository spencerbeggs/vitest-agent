packages:
  - packages/*
  - playground
  - plugins/*
  - website
autoInstallPeers: true
configDependencies:
  "@effected/pnpm-plugin-effect": 0.13.0
  "@savvy-web/pnpm-plugin-silk": 0.46.0
linkWorkspacePackages: deep
peerDependencyRules:
  ignoreMissing:
    - "@vitest/coverage-istanbul"
    - "@vitest/coverage-v8"
    - vitest
resolvePeersFromWorkspaceRoot: false

name: Silk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, changeset-release/main]
    types: [opened, synchronize, reopened, closed]
  # Fork pull requests: runs in this repository's context, so it has secrets,
  # and is gated behind the fork-review environment's required reviewer. No
  # `closed` -- the close-issues phase is driven by pull_request alone.
  pull_request_target:
    branches: [main, changeset-release/main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run in dry-run mode
        type: boolean
        default: false

concurrency:
  # The event name keeps a fork push's pull_request and pull_request_target
  # runs in separate groups; sharing one would cancel one of them.
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  workflow:
    name: Workflow
    uses: spencerbeggs/.github/.github/workflows/release.yml@main
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write
      attestations: write
      checks: write
      artifact-metadata: write
    with:
      runner: macos-26
      dry-run: ${{ inputs.dry_run || false }}
      auto-merge: "squash"
      skip-claude-review: false
      # Fork PRs wait on this environment's required reviewer before any run
      # touches secrets. The environment exists in repo settings; the
      # dispatcher refuses to proceed if it has no required reviewer.
      fork-review-environment: fork-review
      # The validation build regenerates plugin/builds/ (pluginfinity build), so
      # a source edit committed without its rebuilt output shows up as a diff.
      # File modes are ignored: the commit hook strips the exec bit pluginfinity
      # writes on .sh files.
      on-build: git -c core.fileMode=false diff --exit-code --stat -- plugin/builds
    secrets: inherit
